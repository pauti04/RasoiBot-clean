name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Server (install + syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check lib/store.js
          node --check lib/db.js
          node --check lib/recipe.js
          node --check lib/matching.js
          node --check routes/recipes.js
          node --check routes/pantry.js
          node --check routes/shopping.js

      - name: Tests
        run: npm test

      - name: Boot smoke test
        env:
          PORT: 5175
        run: |
          node server.js &
          SERVER_PID=$!
          # Wait for the server to come up (max ~10s)
          for i in $(seq 1 20); do
            if curl -sf http://localhost:$PORT/api/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf http://localhost:$PORT/api/health
          kill $SERVER_PID
