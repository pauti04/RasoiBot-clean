name: ✨ Feature request
description: Suggest a new feature or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the **problem** first and the
        implementation second — that helps us think about the best solution.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do? What's awkward, slow, or impossible today?
      placeholder: Right now I can't filter the shopping list by recipe, so it's hard to see what's left for a specific dish.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How might this work? UI mockups, API shapes, or just a rough idea are all fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other approaches you thought about and why you didn't pick them.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app does this touch?
      multiple: true
      options:
        - Chat / recipe search
        - Pantry
        - Shopping list
        - AI generation
        - API / server
        - Build / dev tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, examples, related issues — anything else.
